[project]
name = "bramapa-tileset"
version = "0.0.1"
description = "Tile atlas and metadata (tiles.toml) for Bramapa, plus the placeholder generator and checker."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
authors = [{ name = "Renato Sandhas" }]
dependencies = [
    "pillow>=11.0",
    "numpy>=2.0",
]

[project.scripts]
bramapa-tileset = "bramapa_tileset.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bramapa_tileset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
