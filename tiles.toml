# ---------------------------------------------------------------- autotiling
# Mascara de 4 bits (N=1, E=2, S=4, W=8) = vizinhos com a MESMA cobertura.
# agua e oceano cobrem as 16 mascaras com as variantes de litoral acima
# (id = base + mascara). rio continua apontando para o mesmo tile: a estrutura
# e o que importa para o pipeline e o motor exercitarem o caminho de autotiling.

[[autotile]]
cover = "agua"
default = 2
[autotile.masks]
