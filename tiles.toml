# ---------------------------------------------------------------- autotiling
# Mascara de 4 bits (N=1, E=2, S=4, W=8) = vizinhos com a MESMA cobertura.
# No placeholder todas as mascaras apontam para o mesmo tile; a estrutura e o
# que importa para o pipeline e o motor exercitarem o caminho de autotiling.

[[autotile]]
cover = "agua"
default = 2
[autotile.masks]
"0" = 2    # isolado
"5" = 2    # N+S (canal vertical)
"10" = 2   # E+W (canal horizontal)
"15" = 2   # cercado

[[autotile]]
cover = "oceano"
default = 3
[autotile.masks]
"0" = 3
"15" = 3

[[autotile]]
cover = "rio"
