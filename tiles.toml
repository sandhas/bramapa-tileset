# bramapa-base — tileset placeholder (Fase 0)
#
# Contrato: bramapa/docs/spec/tileset.md (spec v0).
# Este arquivo e a fonte da verdade do layout do atlas: `bramapa-tileset generate`
# le as posicoes (col/row/frames) daqui e desenha o atlas.png correspondente;
# `bramapa-tileset check` confere que o atlas.png e este arquivo batem.
#
# Ids sao u16 compartilhados entre os quatro repositorios. 0 e reservado (vazio).
#   terrain: 1..19   overlay: 20..39   object: 40..

spec_version = 0

[tileset]
id = "bramapa-base"
version = "0.0.1"
atlas = "atlas.png"
tile_width = 64
tile_height = 32
cell_width = 64
cell_height = 64
license = "CC-BY-4.0"

